name: Release
# Neue Version veröffentlichen:
#   npm version patch        (erhöht die Version und legt den Tag an)
#   git push --follow-tags
# Die Action baut Windows, macOS und Linux und legt alles als GitHub-Release ab.
# Installierte Apps finden das Update dann automatisch.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Client-ID der Twitch-App (öffentlich): Repository → Settings → Secrets and variables → Actions → Variables
          VITE_TWITCH_CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID }}
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
